baseURL: /
title: Harshvardhan
theme: PaperMod
paginate: 1000
enableRobotsTXT: true

services:
  rss:
    limit: 10

taxonomies:
  tag: tags

permalinks:
  research: /:slug/
  writing: /:slug/
  talks: /:slug/
  projects: /:slug/

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      math: true
    parser:
      attribute:
        block: false
        title: false
  highlight:
    style: github
    noClasses: false

outputs:
  home:
    - HTML
    - JSON
  section:
    - HTML
    - RSS

menu:
  main:
    - name: About
      url: /about/
      weight: 1
    - name: Research
      url: /research/
      weight: 3
    - name: Writing
      url: /writing/
      weight: 4
    - name: Talks
      url: /talks/
      weight: 5
    - name: Projects
      url: /projects/
      weight: 6
    - name: CV
      url: /docs/cv.pdf
      weight: 7
    - name: "\U0001F50D"
      url: /search/
      weight: 8

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowBreadCrumbs: false
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  DateFormat: "January 2, 2006"
  disableSpecial1stPost: true
  displayFullLangName: false
  ShowToc: false
  comments: true

  homeInfoParams:
    Title: "Dr. Harshvardhan"
    Content: >
      I'm an Assistant Professor at
      [American University of Sharjah](https://www.aus.edu/) 🇦🇪
      who builds machine learning systems for real-world forecasting problems.
      Before that, I earned my [PhD](/phd/) at the University of Tennessee 🇺🇸
      and spent time at [HP Inc.](/hp-blog-2023/) figuring out how to predict demand for printers. 🖨️
      When I'm not teaching or researching, I [write](/writing/) about
      whatever catches my curiosity — data, philosophy, travel, India, and life ☕

  socialIcons:
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=Q-dbCggAAAAJ"
    - name: github
      url: "https://github.com/harshvardhaniimi"
    - name: linkedin
      url: "https://www.linkedin.com/in/harshvardhaniimi/"
    - name: orcid
      url: "https://orcid.org/0000-0001-8086-544X"
    - name: threads
      url: "https://www.threads.net/@harsh17.in"
    - name: rss
      url: "/writing/index.xml"

  giscus:
    repo: "harshvardhaniimi/harsh17.in"
    repoId: "R_kgDOR_EfYg"
    category: "General"
    categoryId: "DIC_kwDOR_EfYs4C6iFn"
    mapping: "pathname"
    theme: "preferred_color_scheme"

  mailerlite:
    accountId: ""
    formId: ""

  label:
    text: "Harshvardhan"
    icon: ""
    iconHeight: 35

  images:
    - "/img/sharing-image.png"

  cover:
    hidden: true
    responsiveImages: false

  assets:
    favicon: "/img/favicon.ico"
    disableHLJS: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
